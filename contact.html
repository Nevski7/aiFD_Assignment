<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

    <title>Frontiers</title>
</head>
<body>
    <header>
    <a href="index.html">
        <picture>
            <source srcset="images/FrontiersLogoMobile.png"
                    media="(max-width: 768px)">
            <img class="logo"
                 src="images/FrontiersLogoNoBackground.png"
                 alt="Frontiers Logo">
        </picture>
    </a>

    <input type="checkbox" id="menu-toggle" class="menu-toggle">

    <label for="menu-toggle" class="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </label>
        <nav>
            <ul>
                <li><a href="articles.html">Articles</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>    
            </ul>
        </nav>

    <main>
        <section class="contact">
            <h1>Contact Us</h1>
            <p>If you have any questions, suggestions, or just want to say hello, feel free to reach out to us using the form below.</p>
            <form class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea></br>

                <button class="contact-btn">Send Message</button>
            </form>
        </section>
    </main>

    </footer>
